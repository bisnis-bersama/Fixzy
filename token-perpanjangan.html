<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIXZY ADMIN - TOKEN PERPANJANGAN - FIXED</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
.top{background:#0f172a;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer;font-size:11px}
.btn-yellow{background:#facc15;color:#111} .btn-red{background:#ef4444;color:#fff} .btn-dark{background:#0f172a;color:#fff} .btn-white{background:#fff;border:1px solid #e2e8f0}
.wrap{max-width:1100px;margin:auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:12px;border:1px solid #e2e8f0}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #e2e8f0}
input,select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;width:100%;background:#fff}
.table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:10px;margin-top:10px}
table{width:100%;border-collapse:collapse;min-width:750px;font-size:11px}
th{background:#0f172a;color:#fff;padding:9px 8px;text-align:left;font-size:10px;text-transform:uppercase}
td{padding:8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
#loginBox{max-width:380px;margin:60px auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 10px 30px #0002}
.msg{font-size:11px;margin-top:8px;font-weight:800}
</style></head><body>
<div id="loginBox"><h2 style="margin:0 0 8px">🔒 Login Superadmin</h2><p style="font-size:11px;color:#64748b">Hanya superadmin bisa buat token perpanjangan</p><input id="email" value="servicehpmaja@gmail.com" style="width:100%;margin-bottom:8px"><input id="pass" type="password" placeholder="Password" style="width:100%;margin-bottom:8px"><button class="btn btn-dark" style="width:100%" onclick="loginOwner()">Masuk</button><div id="loginErr" style="color:#dc2626;font-size:11px;margin-top:8px;display:none"></div></div>
<div id="app" style="display:none">
<div class="top"><div><h1 style="margin:0;font-size:14px">FIXZY ADMIN - TOKEN PERPANJANGAN - FIXED</h1><small style="color:#94a3b8" id="ownerEmail"></small><small style="color:#facc15;display:block;font-size:10px" id="ownerRole"></small></div><div style="display:flex;gap:6px"><button class="btn btn-white" onclick="loadAll()">↻ Refresh</button><button class="btn btn-red" onclick="logout()">Logout</button></div></div>
<div class="wrap">
<div id="accessDenied" style="display:none;background:#fee2e2;color:#991b1b;padding:14px;border-radius:10px;margin-bottom:12px;font-size:12px;font-weight:800">⛔ Akses ditolak. Hanya Superadmin.</div>
<div class="stats"><div class="stat"><small>Total Token</small><b id="stTotal">0</b></div><div class="stat"><small>Tersedia</small><b id="stSedia">0</b></div><div class="stat"><small>Terpakai</small><b id="stPakai">0</b></div><div class="stat"><small>Pendapatan</small><b id="stUang">Rp 0</b></div></div>
<div class="card"><h3>🎫 Buat Token - Masa Aktif Manual</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div><label style="font-size:10px;font-weight:800">MASA AKTIF HARI</label><input id="paket" type="number" min="1" value="90" style="font-weight:800"></div>
<div><label style="font-size:10px;font-weight:800">JUMLAH TOKEN</label><input id="jml" type="number" value="1" min="1"></div>
<div><label style="font-size:10px;font-weight:800">HARGA / TOKEN Rp</label><input id="harga" type="number" value="50000"></div>
<div><label style="font-size:10px;font-weight:800">PREFIX OPSIONAL</label><input id="pref" placeholder="Kosong = random"></div>
</div>
<button class="btn btn-yellow" style="width:100%;margin-top:10px;height:46px;font-size:14px" onclick="buatToken()">Buat Token Perpanjangan</button>
<div id="msg" style="font-size:11px;margin-top:8px;font-weight:800;color:#15803d"></div>
</div>
<div class="card"><h3>🔎 Daftar Token Perpanjangan</h3><div style="display:grid;grid-template-columns:1fr 120px;gap:6px"><input id="cariPaket" type="number" placeholder="Cari paket hari..." oninput="renderTokens()"><select id="filterStatus" onchange="renderTokens()"><option value="">Semua</option><option value="tersedia">Tersedia</option><option value="terpakai">Terpakai</option></select></div><div class="table-wrap"><table><thead><tr><th>TOKEN</th><th>PAKET HARI</th><th>HARGA</th><th>STATUS</th><th>PEMAKAI</th><th>AKSI</th></tr></thead><tbody id="tokenBody"></tbody></table></div></div>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, addDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg); const auth=getAuth(app); const db=getFirestore(app);
const COL="tokens";
let allTokens=[];

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function isSuperAdmin(user){
  if(!user) return false;
  if((user.email||"").toLowerCase()==="servicehpmaja@gmail.com") return true;
  try{const snap=await getDoc(doc(db,"users",user.uid)); if(!snap.exists()) return false; const role=String(snap.data().role||"").toLowerCase(); return ["superadmin","admin"].includes(role);}catch{return false;}
}
window.loginOwner=async()=>{
  const e=document.getElementById("email").value.trim(); const p=document.getElementById("pass").value;
  const err=document.getElementById("loginErr"); err.style.display="none";
  try{await signInWithEmailAndPassword(auth,e,p);}catch(ex){err.textContent=ex.message; err.style.display="block";}
};
window.logout=async()=>{await signOut(auth); location.reload();};
function randomToken(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="FIXZY-P-"; for(let i=0;i<12;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  const pref=(document.getElementById("pref").value||"").trim().toUpperCase(); return pref?pref+"-"+s:s;
}
window.buatToken=async()=>{
  const user=auth.currentUser;
  if(!(await isSuperAdmin(user))){document.getElementById("msg").style.color="#dc2626"; document.getElementById("msg").textContent="⛔ Hanya superadmin"; return;}
  const hari=Math.max(1,Number(document.getElementById("paket").value||90));
  const jml=Math.max(1,Number(document.getElementById("jml").value||1));
  const harga=Number(document.getElementById("harga").value||0);
  try{
    for(let i=0;i<jml;i++){
      await addDoc(collection(db,COL),{token:randomToken(), paketHari:hari, hari:hari, harga:harga, used:false, createdAt:serverTimestamp(), createdBy:user.uid, createdByEmail:user.email||""});
    }
    document.getElementById("msg").style.color="#15803d"; document.getElementById("msg").textContent=`${jml} token ${hari} hari berhasil dibuat`;
    await loadAll();
  }catch(e){document.getElementById("msg").style.color="#dc2626"; document.getElementById("msg").textContent="Gagal: "+e.message;}
};
window.loadAll=async()=>{
  const user=auth.currentUser;
  if(!(await isSuperAdmin(user))){document.getElementById("accessDenied").style.display="block"; return;}
  document.getElementById("accessDenied").style.display="none";
  try{
    const snap=await getDocs(collection(db,COL));
    allTokens=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderTokens();
  }catch(e){document.getElementById("tokenBody").innerHTML='<tr><td colspan="6" style="color:red">Error: '+esc(e.message)+'</td></tr>';}
};
window.renderTokens=function(){
  const q=Number(document.getElementById("cariPaket").value||0);
  const st=document.getElementById("filterStatus").value;
  let filtered=allTokens.filter(t=>{
    if(q && Number(t.paketHari||t.hari||0)!==q) return false;
    if(st==="tersedia"&&t.used) return false;
    if(st==="terpakai"&&!t.used) return false;
    return true;
  });
  document.getElementById("stTotal").textContent=allTokens.length;
  document.getElementById("stSedia").textContent=allTokens.filter(t=>!t.used).length;
  document.getElementById("stPakai").textContent=allTokens.filter(t=>t.used).length;
  const uang=allTokens.filter(t=>t.used).reduce((s,t)=>s+(Number(t.harga||0)),0);
  document.getElementById("stUang").textContent="Rp "+uang.toLocaleString("id-ID");
  document.getElementById("tokenBody").innerHTML=filtered.map(t=>`<tr><td><b>${esc(t.token)}</b></td><td>${esc(t.paketHari||t.hari||"-")} hari</td><td>Rp ${Number(t.harga||0).toLocaleString("id-ID")}</td><td>${t.used?'<span style="background:#fee2e2;color:#991b1b;padding:3px 7px;border-radius:999px">Terpakai</span>':'<span style="background:#dcfce7;color:#166534;padding:3px 7px;border-radius:999px">Tersedia</span>'}</td><td>${esc(t.usedByEmail||"-")}</td><td><button class="btn btn-white" onclick="navigator.clipboard.writeText('${esc(t.token)}')">Copy</button> <button class="btn btn-red" onclick="if(confirm('Hapus?')) deleteDoc(doc(db,'${COL}','${t.id}')).then(()=>loadAll())">Hapus</button></td></tr>`).join("")||'<tr><td colspan="6" style="text-align:center">Belum ada token</td></tr>';
};
onAuthStateChanged(auth, async user=>{
  const loginBox=document.getElementById("loginBox"); const appDiv=document.getElementById("app");
  if(!user){loginBox.style.display="block"; appDiv.style.display="none"; return;}
  const superAdmin=await isSuperAdmin(user);
  document.getElementById("ownerEmail").textContent=user.email||"";
  document.getElementById("ownerRole").textContent=superAdmin?"Superadmin ✅":"Bukan superadmin ❌";
  if(!superAdmin){loginBox.style.display="none"; appDiv.style.display="block"; document.getElementById("accessDenied").style.display="block"; return;}
  loginBox.style.display="none"; appDiv.style.display="block"; await loadAll();
});
</script>
</body></html>
