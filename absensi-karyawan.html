<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081326">
<title>FIXZY | Absensi Karyawan - FIXED ISOLASI</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f3f6fa;--card:#fff;--line:#dfe5ee;--text:#111827;--muted:#64748b;--yellow:#ffc107;--navy:#081326;--green:#16a34a;--red:#dc2626;--blue:#2563eb;--orange:#f59e0b}
body{margin:0;background:linear-gradient(180deg,#fff,#f3f6fa 260px);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:50;background:#081326;color:#fff;border-bottom:1px solid #1b2940;box-shadow:0 3px 14px #0004}
.header-in{max-width:1100px;margin:auto;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.brandbox{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:48px;height:48px;object-fit:contain;border-radius:10px;background:#000;flex:none}
.brand{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.owner{font-size:11px;color:#cbd5e1;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:7px;flex:none}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900}
.refresh{background:var(--yellow);color:#111827}
.wrap{max-width:1100px;margin:auto;padding:14px 10px 70px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:12px;overflow:hidden;box-shadow:0 5px 20px #17203308}
.head{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
.body{padding:14px 16px}
.status{font-size:11px;color:var(--muted);line-height:1.5}
.ok{color:#15803d;font-weight:800}.err{color:#b91c1c;font-weight:800}
.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:9px}
.field{display:flex;flex-direction:column;gap:5px}
label{font-size:11px;font-weight:900;color:#475569}
input,select,textarea{width:100%;height:42px;border:1px solid #cbd5e1;border-radius:10px;padding:0 11px;background:#fff;outline:none}
textarea{height:70px;padding-top:10px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f59e0b18}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.sum{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px}
.sum small{display:block;font-size:10px;color:#64748b;font-weight:900}
.sum b{display:block;font-size:20px;margin-top:4px}
.sum.green{background:#ecfdf5;border-color:#a7f3d0}.sum.green b{color:#047857}
.sum.blue{background:#eff6ff;border-color:#bfdbfe}.sum.blue b{color:#1d4ed8}
.sum.red{background:#fef2f2;border-color:#fecaca}.sum.red b{color:#b91c1c}
.sum.orange{background:#fff7ed;border-color:#fed7aa}.sum.orange b{color:#c2410c}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;min-width:980px;border-collapse:collapse}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:11px;text-align:left;vertical-align:middle}
th{background:#f8fafc;color:#475569;font-size:10px;position:sticky;top:0}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900;white-space:nowrap}
.hadir{background:#dcfce7;color:#166534}.izin{background:#fef3c7;color:#92400e}.sakit{background:#dbeafe;color:#1d4ed8}.alpa{background:#fee2e2;color:#b91c1c}.belum{background:#f1f5f9;color:#64748b}
.role{background:#ede9fe;color:#6d28d9}
.row-actions{display:flex;gap:5px;flex-wrap:wrap}
.mini{border:0;border-radius:8px;padding:7px 9px;font-size:9px;font-weight:900}
.masuk{background:#dcfce7;color:#166534}.pulang{background:#dbeafe;color:#1d4ed8}.edit{background:#fef3c7;color:#92400e}
.empty{text-align:center;color:#64748b;padding:24px}
.popup{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:100}
.popup.show{display:flex}
.popup-box{width:min(520px,calc(100% - 24px));max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:17px}
</style>
</head>
<body>

<header class="header">
  <div class="header-in">
    <div class="brandbox">
      <img src="logo.png" class="logo" alt="FIXZY">
      <div>
        <div class="brand">ABSENSI KARYAWAN - FIXED</div>
        <div id="ownerName" class="owner">Memuat nama pemilik...</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn refresh" type="button" onclick="muatSemua()">↻ Refresh</button>
    </div>
  </div>
</header>

<main class="wrap">

<section class="card">
  <div class="body">
    <div id="status" class="status">Memeriksa login Firebase...</div>
  </div>
</section>

<section class="summary">
  <div class="sum"><small>TOTAL AKUN</small><b id="total">0</b></div>
  <div class="sum green"><small>HADIR</small><b id="hadir">0</b></div>
  <div class="sum blue"><small>SUDAH PULANG</small><b id="pulang">0</b></div>
  <div class="sum red"><small>BELUM ABSEN</small><b id="belum">0</b></div>
  <div class="sum orange"><small>TOTAL UPAH BULAN</small><b id="totalUpahBulan">Rp 0</b></div>
</section>

<section class="card">
  <div class="head">
    <span>👥 Absensi Karyawan (hanya konter ini)</span>
    <span id="tanggalLabel">-</span>
  </div>
  <div class="body">
    <div class="toolbar">
      <div class="field">
        <label>TANGGAL ABSENSI</label>
        <input id="tanggal" type="date">
      </div>
      <div class="field">
        <label>BULAN PERHITUNGAN UPAH</label>
        <input id="bulan" type="month">
      </div>
      <div class="field">
        <label>CARI</label>
        <input id="cari" placeholder="Nama, email, jabatan..." oninput="render()">
      </div>
      <div class="field">
        <label>STATUS</label>
        <select id="filterStatus" onchange="render()"><option value="">Semua</option><option value="hadir">Hadir</option><option value="belum">Belum</option><option value="izin">Izin</option><option value="sakit">Sakit</option><option value="alpa">Alpa</option></select>
      </div>
    </div>
    <div class="table-wrap" style="margin-top:12px">
      <table>
        <thead><tr><th>Nama</th><th>Jabatan</th><th>Role</th><th>WA</th><th>Masuk</th><th>Pulang</th><th>Status</th><th>Bulan</th><th>Upah</th><th>Aksi</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="10" class="empty">Memuat Firebase...</td></tr></tbody>
      </table>
    </div>
  </div>
</section>

</main>

<div class="popup" id="popup"><div class="popup-box">
<h3 id="popupTitle">Absensi</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
<div><label>Nama</label><input id="fNama" readonly></div>
<div><label>Jabatan</label><input id="fJabatan" readonly></div>
<div><label>Tanggal</label><input id="fTanggal" type="date"></div>
<div><label>Status</label><select id="fStatus"><option value="hadir">Hadir</option><option value="izin">Izin</option><option value="sakit">Sakit</option><option value="alpa">Alpa</option><option value="belum">Belum</option></select></div>
<div><label>Jam Masuk</label><input id="fMasuk" type="time"></div>
<div><label>Jam Pulang</label><input id="fPulang" type="time"></div>
<div style="grid-column:1/-1"><label>Catatan</label><textarea id="fCatatan"></textarea></div>
</div>
<div style="display:flex;justify-content:flex-end;gap:7px;margin-top:13px">
<button class="secondary" onclick="document.getElementById('popup').classList.remove('show')">Batal</button>
<button class="primary" onclick="simpanAbsensi()">Simpan</button>
</div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, getDocsFromServer, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

let uid="", ownerUid="", profile={}, accounts=[], absensi={}, monthlyAbsensi={}, selected=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function today(){return new Date().toISOString().slice(0,10);}
function nowTime(){return new Date().toTimeString().slice(0,5);}
function getDateKey(){return $("tanggal").value||today();}
function makeId(userId,date){return `${userId}_${date}`;}
function nama(a){return a.nama||a.namaKaryawan||a.displayName||a.email||"-";}
function phone(a){return a.noWA||a.wa||a.noHp||a.whatsapp||"";}
function roleLabel(r){return String(r||"").toUpperCase();}
function statusLabel(s){return String(s||"").toUpperCase();}
function statusClass(s){return String(s||"belum").toLowerCase();}
function rupiah(n){return "Rp "+(Number(n)||0).toLocaleString("id-ID");}

async function loadProfile(){
  const snap=await getDoc(doc(db,"users",uid));
  if(!snap.exists()) throw new Error("Profil tidak ditemukan");
  profile=snap.data()||{};
  const role=String(profile.role||"").toLowerCase();
  ownerUid = (role==="owner"||profile.isOwner===true) ? uid : (profile.ownerUid||profile.ownerId||uid);
  $("ownerName").textContent=(profile.namaKonter||profile.nama||"FIXZY")+" • ownerUid "+ownerUid.slice(0,6);
}

async function loadAccounts(){
  // FIX ISOLASI - hanya akun dengan ownerUid == myOwnerUid
  const map=new Map();
  async function ambil(field,value){
    try{
      const q=query(collection(db,"users"), where(field,"==",value));
      const snap=await getDocsFromServer(q);
      snap.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
    }catch(e){console.warn("users",field,e.message);}
  }
  await ambil("ownerUid", ownerUid);
  await ambil("ownerId", ownerUid);
  await ambil("uid", ownerUid);
  // include self
  try{const me=await getDoc(doc(db,"users",uid)); if(me.exists()) map.set(me.id,{id:me.id,...me.data()});}catch{}
  
  accounts=[...map.values()].filter(u=>{
    const r=String(u.role||"").toLowerCase();
    const isWorker=["employee","karyawan","kasir","kurir","teknisi","reseller","admin"].includes(r) || r==="owner";
    const same = String(u.ownerUid||u.ownerId||"")==ownerUid || String(u.id)==ownerUid || String(u.uid)==ownerUid || String(u.id)==uid;
    return isWorker || same;
  });
}

async function loadAbsensi(){
  absensi={}; monthlyAbsensi={};
  const date=getDateKey();
  const month=$("bulan").value||today().slice(0,7);

  // FIX ISOLASI - query absensi hanya milik ownerUid ini
  const map=new Map();
  async function ambil(field,value){
    try{
      const q=query(collection(db,"absensi"), where(field,"==",value));
      const snap=await getDocsFromServer(q);
      snap.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
    }catch(e){console.warn("absensi",field,e.message);}
  }
  await ambil("ownerUid", ownerUid);
  await ambil("ownerId", ownerUid);

  // filter by tanggal yang diminta
  const filtered=[...map.values()].filter(x=>String(x.tanggal||"").startsWith(date)||String(x.tanggal||"").startsWith(month));
  // map ke accounts
  filtered.forEach(x=>{
    const uidKey=x.userId||x.uid||"";
    if(uidKey) absensi[uidKey]=x;
    if(String(x.tanggal||"").slice(0,7)===month){
      if(!monthlyAbsensi[uidKey]) monthlyAbsensi[uidKey]=[];
      monthlyAbsensi[uidKey].push(x);
    }
  });

  // fallback: coba baca per id jika query tidak ada (kompatibel data lama)
  for(const a of accounts){
    if(absensi[a.id]) continue;
    try{
      const s=await getDoc(doc(db,"absensi",makeId(a.id,date)));
      if(s.exists()){
        const x={id:s.id,...s.data()};
        if(String(x.ownerUid||"")==ownerUid || String(x.ownerUid||"")==uid || !x.ownerUid){
          absensi[a.id]=x;
        }
      }
    }catch{}
  }
  render();
}

function getRowStatus(a){const x=absensi[a.id]; if(!x) return "belum"; return x.status||((x.jamMasuk||x.jamPulang)?"hadir":"belum");}
function upahHarian(a){const n=Number(a.upahHarian??a.upah??a.gajiHarian??0); return Number.isFinite(n)?n:0;}
function dataBulan(a){return monthlyAbsensi[a.id]||[];}
function jumlahHadirBulan(a){return dataBulan(a).filter(x=>String(x.status||"").toLowerCase()==="hadir").length;}
function upahBulan(a){return jumlahHadirBulan(a)*upahHarian(a);}
function totalUpahSemuaBulan(){return accounts.reduce((sum,a)=>sum+upahBulan(a),0);}

function render(){
  const q=($("cari").value||"").toLowerCase().trim();
  const fs=$("filterStatus").value;
  const data=accounts.filter(a=>{
    const text=[nama(a),a.email,a.jabatan,roleLabel(a.role),phone(a)].join(" ").toLowerCase();
    const st=getRowStatus(a);
    return (!q||text.includes(q))&&(!fs||st===fs);
  });
  $("total").textContent=accounts.length;
  $("hadir").textContent=accounts.filter(a=>getRowStatus(a)==="hadir").length;
  $("pulang").textContent=accounts.filter(a=>!!(absensi[a.id]?.jamPulang)).length;
  $("belum").textContent=accounts.filter(a=>getRowStatus(a)==="belum").length;
  $("totalUpahBulan").textContent=rupiah(totalUpahSemuaBulan());
  if(!data.length){$("tbody").innerHTML='<tr><td colspan="10" class="empty">Belum ada data untuk ditampilkan.</td></tr>';return;}
  $("tbody").innerHTML=data.map(a=>{
    const x=absensi[a.id]||{}; const st=getRowStatus(a); const hadirBulan=jumlahHadirBulan(a); const upah=upahBulan(a);
    return `<tr>
      <td><b>${esc(nama(a))}</b><div style="font-size:9px;color:#94a3b8">${esc(a.email||"")}</div></td>
      <td>${esc(a.jabatan||a.posisi||"-")}</td>
      <td><span class="badge role">${esc(roleLabel(a.role))}</span></td>
      <td>${esc(phone(a))}</td>
      <td><b>${esc(x.jamMasuk||"-")}</b></td>
      <td><b>${esc(x.jamPulang||"-")}</b></td>
      <td><span class="badge ${statusClass(st)}">${statusLabel(st)}</span></td>
      <td><b>${hadirBulan}</b> hari</td>
      <td><b>${rupiah(upah)}</b><div style="font-size:9px;color:#94a3b8">${rupiah(upahHarian(a))}/hari</div></td>
      <td><div class="row-actions">
        <button class="mini masuk" onclick="aksiMasuk('${a.id}')">Masuk</button>
        <button class="mini pulang" onclick="aksiPulang('${a.id}')">Pulang</button>
        <button class="mini edit" onclick="editAbsensi('${a.id}')">Edit</button>
      </div></td>
    </tr>`;
  }).join("");
}
window.render=render;

function bukaForm(a,mode){
  selected=a;
  const x=absensi[a.id]||{};
  $("fNama").value=nama(a);
  $("fJabatan").value=a.jabatan||a.posisi||"";
  $("fTanggal").value=getDateKey();
  $("fStatus").value=x.status||"hadir";
  $("fMasuk").value=x.jamMasuk||"";
  $("fPulang").value=x.jamPulang||"";
  $("fCatatan").value=x.catatan||"";
  $("popup").classList.add("show");
}
window.aksiMasuk=id=>{const a=accounts.find(x=>x.id===id);if(a)bukaForm(a,"masuk")};
window.aksiPulang=id=>{const a=accounts.find(x=>x.id===id);if(a)bukaForm(a,"pulang")};
window.editAbsensi=id=>{const a=accounts.find(x=>x.id===id);if(a)bukaForm(a,"edit")};

async function simpanAbsensi(){
  if(!selected) return;
  const date=$("fTanggal").value||getDateKey();
  const id=makeId(selected.id,date);
  const data={
    ownerUid, // FIX ISOLASI - wajib simpan ownerUid
    ownerId: ownerUid,
    userId:selected.id,
    uid:selected.uid||selected.id,
    nama:nama(selected),
    namaKaryawan:selected.namaKaryawan||selected.nama||nama(selected),
    email:selected.email||"",
    role:selected.role||"",
    jabatan:selected.jabatan||selected.posisi||"",
    noHp:phone(selected),
    tanggal:date,
    jamMasuk:$("fMasuk").value||"",
    jamPulang:$("fPulang").value||"",
    status:$("fStatus").value||"hadir",
    catatan:$("fCatatan").value.trim(),
    updatedAt:serverTimestamp()
  };
  try{
    const existing=await getDoc(doc(db,"absensi",id));
    if(!existing.exists()) data.createdAt=serverTimestamp();
    await setDoc(doc(db,"absensi",id),data,{merge:true});
    $("popup").classList.remove("show");
    await loadAbsensi();
  }catch(e){alert("Gagal: "+e.message);}
}
window.simpanAbsensi=simpanAbsensi;

window.muatAbsensi=async()=>{
  try{
    $("status").textContent="Memuat data absensi (hanya konter ini)...";
    await loadAccounts();
    await loadAbsensi();
    $("status").innerHTML=`<span class="ok">✓ Firebase aktif • ${accounts.length} akun terdaftar untuk ownerUid ${esc(ownerUid.slice(0,8))} • Isolasi aktif</span>`;
  }catch(e){$("status").innerHTML=`<span class="err">${esc(e.message||e)}</span>`;}
};
window.muatSemua=async()=>{ $("tanggal").value=today(); await window.muatAbsensi(); };

$("tanggal").value=today();
$("bulan").value=today().slice(0,7);

onAuthStateChanged(auth,async u=>{
  if(!u){location.replace("login.html");return}
  uid=u.uid;
  try{ await loadProfile(); await window.muatAbsensi(); }
  catch(e){$("status").innerHTML=`<span class="err">${esc(e.message||e)}</span>`;}
});
</script>
</body>
</html>
