<!DOCTYPE html>
<html lang="id">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#111111">
<title>FIXZY | Produk Spreadsheet</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--y:#ffc107;--txt:#172033;--muted:#64748b;--green:#16a34a;--red:#dc2626}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif}
body{background:linear-gradient(180deg,#fff 0,#f5f7fb 250px)}
button,input{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:20;background:#111827;border-bottom:1px solid #111827;box-shadow:0 2px 12px #17203322}
.header-in{max-width:1180px;margin:auto;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:42px;height:42px;border-radius:12px;object-fit:cover;background:#fff}
.brand h1{font-size:18px;font-weight:900;color:#fff}.brand p{font-size:10px;color:#cbd5e1;margin-top:3px}
.head-btn{height:40px;border:0;border-radius:10px;background:#fff;color:#111827;padding:0 12px;font-size:13px;font-weight:800}.head-btn.refresh{background:var(--y)}
.container{width:min(1180px,100%);margin:auto;padding:16px 14px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:14px;box-shadow:0 5px 18px #17203308}
.title{font-size:15px;font-weight:900;margin-bottom:5px}.sub{font-size:11px;color:var(--muted);line-height:1.5}
.sheetbox{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:12px}
.sheetbox input{height:46px;width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:0 13px;outline:none}
.sheetbox input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px #f59e0b18}
.btn{min-height:44px;border:0;border-radius:11px;padding:10px 15px;font-weight:900}.primary{background:linear-gradient(135deg,#ffc107,#f59e0b);color:#111827}.dark{background:#111827;color:#fff}.green{background:var(--green);color:#fff}
.msg{display:none;margin-top:10px;padding:10px;border-radius:10px;font-size:11px;white-space:pre-line;line-height:1.5;overflow-wrap:anywhere}.msg.show{display:block}.msg.ok{color:#166534;background:#f0fdf4;border:1px solid #bbf7d0}.msg.err{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca}.msg.info{color:#92400e;background:#fffbeb;border:1px solid #fde68a}
.saved{margin-top:10px;padding:10px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:10px;color:#475569;overflow-wrap:anywhere}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.search{flex:1;min-width:210px;height:43px;border:1px solid #cbd5e1;border-radius:11px;padding:0 12px;outline:none}
.count{font-size:11px;color:var(--muted);font-weight:800}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;min-width:760px;border-collapse:collapse}th{padding:11px;background:#f8fafc;color:#475569;font-size:10px;text-align:left;position:sticky;top:0}td{padding:10px;border-bottom:1px solid #edf0f3;font-size:11px;vertical-align:middle}.price{font-weight:900;color:#b45309}.supplier{font-weight:800;color:#475569}
.mobile-list{display:none;gap:9px}.m-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 4px 12px #17203308}.m-name{font-size:12px;font-weight:900;line-height:1.35}.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.m-grid div{background:#f8fafc;border-radius:8px;padding:8px;font-size:10px}.m-grid b{display:block;color:#94a3b8;font-size:8px;margin-bottom:2px}
.loading{display:none;position:fixed;inset:0;z-index:100;background:#11182766;align-items:center;justify-content:center}.loading.show{display:flex}.loader{background:#fff;border-radius:16px;padding:23px;text-align:center}.spin{width:30px;height:30px;border:4px solid #e5e7eb;border-top-color:#f59e0b;border-radius:50%;animation:s .8s linear infinite;margin:auto auto 10px}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:600px){.header-in{padding:9px 10px}.brand h1{font-size:16px}.brand p{font-size:9px}.head-btn{height:38px;padding:0 9px}.container{padding:10px}.sheetbox{grid-template-columns:1fr}.table-wrap{display:none}.mobile-list{display:grid}.toolbar{display:grid;grid-template-columns:1fr}.search{width:100%}.modal-actions{grid-template-columns:1fr}.card{padding:12px}}

.multilinks{display:grid;gap:9px;margin-top:12px}
.linkrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.linkrow input{height:44px;width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:0 12px;outline:none}
.linkrow input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px #f59e0b18}
.linknum{font-size:10px;font-weight:900;color:#64748b;margin-bottom:3px}
.link-remove{height:44px;border:0;border-radius:10px;padding:0 12px;background:#fee2e2;color:#b91c1c;font-weight:900}
@media(max-width:600px){.linkrow{grid-template-columns:1fr auto}}
</style>
</head>
<body>
<header class="header">
  <div class="header-in">
    <div class="brand">
      <img src="logo.png" class="logo" onerror="this.style.display='none'">
      <div><h1>FIXZY</h1><p>Produk dari Spreadsheet</p></div>
    </div>
    <button class="head-btn refresh" id="refreshBtn" onclick="location.reload()">↻ Refresh</button>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="title">🔗 Hubungkan Spreadsheet Produk</div>
    <div class="sub">Firebase hanya menyimpan link spreadsheet. Nama produk, harga, supplier, dan stok dibaca langsung dari Spreadsheet.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="btn dark" id="addLinkBtn" onclick="addLinkRow()">＋ Tambah Link</button>
      <button class="btn primary" id="saveBtn" onclick="saveSpreadsheet()">💾 SIMPAN SEMUA LINK</button>
    </div>
    <div id="linkRows" class="multilinks" style="display:none"></div>
    <div id="msg" class="msg"></div>
    <div id="saved" class="saved" style="display:none"></div>
  </section>

  <section class="card">
    <div class="toolbar">
      <input id="search" class="search" placeholder="🔎 Cari nama produk / supplier...">
      <span id="count" class="count">0 produk</span>
      <button class="btn dark" onclick="loadSpreadsheet()">↻ RELOAD DATA</button>
    </div>
    <div id="listMsg" class="sub">Belum ada Spreadsheet yang dihubungkan.</div>

    <div class="table-wrap" style="margin-top:11px">
      <table>
        <thead><tr>
          <th>Nama Produk</th><th>Supplier</th><th>Harga Tunai</th><th>Harga Tempo</th><th>Stok</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="mobileList" class="mobile-list" style="margin-top:11px"></div>
  </section>
</main>

<div class="loading" id="loading"><div class="loader"><div class="spin"></div><b id="loadingText">Memuat...</b></div></div>


<script type="module">
import{initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);

function roleNorm(v){return String(v||"").trim().toLowerCase();}
function isSuperAdminEmail(email){return String(email||"").toLowerCase()==="servicehpmaja@gmail.com";}
function resolveBusinessUid(profile,user){
  const r=roleNorm(profile?.role);
  const superAdm = r==="superadmin" || r==="super_admin" || isSuperAdminEmail(user?.email) || profile?.isSuperAdmin===true;
  if(r==="owner" || profile?.isOwner===true || superAdm){
    return String(user?.uid||"").trim();
  }
  return String(profile?.ownerUid||profile?.ownerId||"").trim();
}

let uid="",ownerUid="",businessOwnerUid="",products=[];

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function money(n){return "Rp "+(Number(n)||0).toLocaleString("id-ID")}
function message(t,type){const el=$("msg"); el.textContent=t; el.className="msg show "+(type||"info"); el.style.display="block";}
function showLoading(on,txt){const el=document.querySelector(".loading"); if(!el) return; el.classList.toggle("show",!!on); if(txt) el.querySelector("div").textContent=txt;}

function getLinkInputs(){return [...document.querySelectorAll("#linkRows .linkrow input")];}
window.addLinkRow=function(val=""){
  const wrap=$("linkRows"); wrap.style.display="grid";
  const div=document.createElement("div"); div.className="linkrow";
  div.innerHTML=`<div><div class="linknum">Spreadsheet</div><input type="url" placeholder="https://docs.google.com/.../pub?output=csv"></div><button class="link-remove" onclick="this.parentElement.remove()">✕</button>`;
  div.querySelector("input").value=val;
  wrap.appendChild(div);
}

async function getSavedLinks(){
  if(!businessOwnerUid) return [];
  try{
    const snap=await getDoc(doc(db,"pengaturan_spreadsheet",businessOwnerUid));
    if(!snap.exists()) return [];
    const d=snap.data()||{};
    let links=Array.isArray(d.spreadsheetLinks)?d.spreadsheetLinks.map(x=>String(x||"").trim()).filter(Boolean):[];
    if(!links.length && d.spreadsheetUrl) links=[String(d.spreadsheetUrl).trim()].filter(Boolean);
    return [...new Set(links)];
  }catch(e){console.warn(e); return [];}
}

async function readSheet(url){
  // support csv publish link
  let csvUrl=url.trim();
  if(csvUrl.includes("/edit")) csvUrl=csvUrl.replace("/edit","/pub").split("?")[0]+"?output=csv";
  if(!csvUrl.includes("output=csv") && csvUrl.includes("docs.google")) csvUrl+="?output=csv";
  const res=await fetch(csvUrl);
  if(!res.ok) throw new Error("Gagal fetch "+res.status);
  const text=await res.text();
  const lines=text.split("\n").filter(l=>l.trim());
  if(!lines.length) return [];
  const headers=lines[0].split(",").map(h=>h.replace(/"/g,"").trim().toLowerCase());
  const idxNama=headers.findIndex(h=>h.includes("nama")||h.includes("produk"));
  const idxSup=headers.findIndex(h=>h.includes("supplier")||h.includes("supl"));
  const idxModal=headers.findIndex(h=>h.includes("modal")||h.includes("tunai")||h.includes("beli"));
  const idxJual=headers.findIndex(h=>h.includes("jual")||h.includes("tempo"));
  const idxStok=headers.findIndex(h=>h.includes("stok")||h.includes("stock"));
  const idxKode=headers.findIndex(h=>h.includes("kode"));
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(",").map(c=>c.replace(/"/g,"").trim());
    if(!cols[idxNama]) continue;
    rows.push({nama:cols[idxNama]||"", supplier:cols[idxSup]||"", modal:cols[idxModal]||0, jual:cols[idxJual]||0, stok:cols[idxStok]||0, kode:cols[idxKode]||""});
  }
  return rows;
}

window.saveSpreadsheet=async function(){
  if(!businessOwnerUid){message("Login belum siap","err");return;}
  const inputs=getLinkInputs(); const links=inputs.map(x=>x.value.trim()).filter(Boolean);
  if(!links.length){message("Belum ada link","err");return;}
  const invalid=links.find(x=>!/^https?:\/\//i.test(x)); if(invalid){message("Ada link tidak valid","err");return;}
  showLoading(true,"Menyimpan...");
  try{
    await setDoc(doc(db,"pengaturan_spreadsheet",businessOwnerUid),{uid:businessOwnerUid, spreadsheetLinks:links, spreadsheetUrl:links[0], updatedAt:serverTimestamp()},{merge:true});
    message(`${links.length} link berhasil disimpan (Owner: ${businessOwnerUid.slice(0,6)}) SYNC v2`,"ok");
    await loadSpreadsheet();
  }catch(e){message("Gagal menyimpan: "+e.message,"err");}finally{showLoading(false);}
};

window.loadSpreadsheet=async function(){
  if(!businessOwnerUid){$("listMsg").textContent="Menunggu login...";return;}
  showLoading(true,"Membaca spreadsheet...");
  try{
    const links=await getSavedLinks();
    if(!links.length){products=[];render();$("listMsg").textContent="Belum ada spreadsheet. Tambah link lalu SIMPAN.";return;}
    $("linkRows").innerHTML=""; $("linkRows").style.display="grid"; links.forEach(l=>addLinkRow(l));
    const results=[]; const errors=[];
    for(let i=0;i<links.length;i++){
      try{ const rows=await readSheet(links[i]); rows.forEach(p=>{p.sourceIndex=i+1; results.push(p);}); }catch(e){errors.push(`Sheet ${i+1}: ${e.message}`);}
    }
    products=results; render();
    if(errors.length) $("listMsg").textContent=`${results.length} produk, ${errors.length} gagal: ${errors.join("; ")}`;
    else $("listMsg").textContent=`Semua ${links.length} spreadsheet berhasil dibaca. ${results.length} produk. SYNC v2 - Owner: ${businessOwnerUid.slice(0,6)}`;
  }catch(e){$("listMsg").textContent="Gagal: "+e.message; message(e.message,"err");}finally{showLoading(false);}
};

function render(){
  const q=$("search").value.toLowerCase().trim();
  const arr=products.filter(p=>[p.nama,p.supplier,p.kode].join(" ").toLowerCase().includes(q));
  $("count").textContent=`${arr.length} produk`;
  $("tbody").innerHTML=arr.map(p=>`<tr><td><b>${esc(p.nama)}</b><div style="font-size:9px;color:#94a3b8">${esc(p.kode||"")}</div></td><td class="supplier">${esc(p.supplier||"-")}</td><td class="price">${money(p.modal)}</td><td class="price">${money(p.jual)}</td><td>${p.stok}</td></tr>`).join("")||'<tr><td colspan="5" style="text-align:center;padding:25px">Tidak ada produk</td></tr>';
  $("mobileList").innerHTML=arr.map(p=>`<div class="m-card"><div class="m-name">${esc(p.nama)}</div><div style="font-size:9px;color:#94a3b8">${esc(p.supplier||"-")}</div><div class="m-grid"><div><b>Tunai</b><span class="price">${money(p.modal)}</span></div><div><b>Tempo</b><span class="price">${money(p.jual)}</span></div><div><b>Stok</b>${p.stok}</div><div><b>Kode</b>${esc(p.kode||"-")}</div></div></div>`).join("");
}

$("search").addEventListener("input",render);

onAuthStateChanged(auth,async user=>{
  if(!user){message("Session belum aktif. Buka dari index.html yang sudah login","err");return;}
  uid=user.uid;
  try{
    const snap=await getDoc(doc(db,"users",uid));
    const p=snap.exists()?snap.data():{};
    ownerUid=resolveBusinessUid(p,user);
    businessOwnerUid=ownerUid;
    if(!businessOwnerUid) throw new Error("Owner UID tidak ditemukan");
    $("saved").style.display="block";
    $("saved").textContent=`Akun: ${user.email} • Owner: ${businessOwnerUid.slice(0,6)} • SYNC v2`;
    const links=await getSavedLinks();
    if(links.length){$("linkRows").innerHTML="";$("linkRows").style.display="grid";links.forEach(l=>addLinkRow(l));$("saved").textContent=`${links.length} spreadsheet tersimpan • Owner ${businessOwnerUid.slice(0,6)}`; loadSpreadsheet();}
  }catch(e){message("Gagal load profile: "+e.message,"err");}
});
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
